name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --no-warnings

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm typecheck

      - name: Check standalone scripts
        run: pnpm check:bridge

      - name: Build
        run: pnpm build

      - name: Verify manifest, artifacts and packaging
        run: node .github/scripts/verify.mjs

      - name: Verify committed dist matches a fresh build
        run: |
          git add --intent-to-add -- dist
          if ! git diff --exit-code -- dist; then
            echo "The committed dist/ bundle does not match a fresh build of src/."
            echo "Run 'pnpm build' and commit the regenerated dist/ files."
            exit 1
          fi

      - name: Verify the installer CLI
        env:
          DINOTTY_PLUGINS_DIR: ${{ runner.temp }}/dinotty-plugins
        run: |
          node scripts/cli.mjs install
          node .github/scripts/verify.mjs --installed "$DINOTTY_PLUGINS_DIR/dinotty-omp"
          node scripts/cli.mjs uninstall

  cross-platform:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm build

      - name: Verify artifacts and installer CLI
        env:
          DINOTTY_PLUGINS_DIR: ${{ runner.temp }}/dinotty-plugins
        run: |
          node .github/scripts/verify.mjs --artifacts-only
          node scripts/cli.mjs install
          node .github/scripts/verify.mjs --installed "${{ runner.temp }}/dinotty-plugins/dinotty-omp"
          node scripts/cli.mjs uninstall

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify tag matches the manifest version
        run: |
          node -e "
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const plugin = require('./plugin.json');
          const pkg = require('./package.json');
          if (plugin.version !== tag || pkg.version !== tag) {
            console.error('Tag ' + tag + ' does not match plugin.json ' + plugin.version + ' and package.json ' + pkg.version);
            process.exit(1);
          }
          console.log('Version parity verified for ' + tag);
          "

      - name: Build
        run: pnpm build

      - name: Verify manifest and artifacts
        run: node .github/scripts/verify.mjs

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Package the plugin folder
        run: |
          stage="$(mktemp -d)/dinotty-omp"
          mkdir -p "$stage"
          cp plugin.json README.md LICENSE "$stage/"
          cp -R dist bin "$stage/"
          asset="$PWD/dinotty-omp-${GITHUB_REF_NAME}.zip"
          (cd "$(dirname "$stage")" && zip -r -q "$asset" dinotty-omp)
          unzip -l "$asset"
          echo "RELEASE_ASSET=dinotty-omp-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true
